  s_min: 32
  beta_sweep: [0.2, 0.4]
  s_sweep: [16, 64]
windows: {448: [4, 7, 14], 896: [4, 7, 8, 14, 28]}
groups: [2, 3, 4, 6, 8, 16, 32]
kmeans: [2, 3, 4, 6, 8, 16, 32]
