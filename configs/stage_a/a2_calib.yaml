# Stage A, A2 on the calibration set (owner decision 2026-11-17). Grids widened from the brief: see DECISIONS.md.
run_id: a2-calib
seed: 0
resolutions: [448, 896]
batch: {448: 8, 896: 2}
chunk: 64
loader_workers: 4
trees:
